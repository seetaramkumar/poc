# ============================================================
#  Stock Regime Engine — Configuration
#  Complete config including all phases (1-3 + breadth/sector/router)
#  Replace your existing config.yaml with this file entirely.
# ============================================================

indicators:
  ema_periods:
    fast: 20
    mid:  50
    slow: 200

  adx_period:       14
  atr_period:       14
  volume_ma_period: 20
  rs_period:        63
  high_period:      252

  rs_periods:
    short:  21
    medium: 63
    long:   126
  rs_trend_window: 10

thresholds:
  # ── ADX ──────────────────────────────────────────────────────
  adx_strong_trend: 25.0
  adx_weak_trend:   18.0

  # ── ATR ──────────────────────────────────────────────────────
  atr_ma_period:        20
  atr_volatile_ratio:   1.30
  atr_quiet_ratio:      0.70
  atr_compressed_ratio: 0.75
  atr_expanding_ratio:  1.00

  # ── EMA slope ────────────────────────────────────────────────
  ema_slope_window:   5
  ema_flat_threshold: 0.001

  # ── Volume ───────────────────────────────────────────────────
  volume_surge_ratio: 1.50

  # ── Relative Strength ────────────────────────────────────────
  rs_positive_threshold:       1.02
  rs_negative_threshold:       0.98
  rs_strong_threshold:         1.05
  rs_trend_positive_threshold: 0.0005

  # ── Breakout ─────────────────────────────────────────────────
  near_high_pct: 0.03

  # ── ROC / momentum ───────────────────────────────────────────
  acceleration_threshold: 0.5
  roc_positive_min:       0.0

  # ── Trend quality ────────────────────────────────────────────
  higher_highs_window:    20
  higher_highs_min_count:  5
  ema_extended_pct:       0.10

  # ── Phase 3: Composite volatility instability ─────────────────
  # PRIMARY threshold: composite > this → volatile_instability = True
  # Clean trends ≈ 0.10–0.25; erratic stocks ≈ 0.45–0.80
  volatility_instability_composite_threshold: 0.40

  # Anti-volatile guard ceiling: scores >= this are never suppressed
  # even on structurally trending stocks
  volatility_instability_severe_threshold: 0.55

  # Rolling window for all instability components (bars)
  volatility_instability_window: 20

  # Individual fallback thresholds (used when composite unavailable)
  candle_instability_threshold: 0.50    # dir_cv_score threshold
  reversal_frequency_threshold: 0.55
  gap_frequency_threshold:      0.15
  gap_threshold_pct:            0.01
  wickiness_threshold:          0.45

  # ── Phase 2: Range detection ──────────────────────────────────
  bb_period:                20
  bb_std:                    2.0
  bb_narrow_threshold:      0.04
  der_window:               14
  der_range_threshold:      0.35
  ema_compressed_threshold: 0.005

scoring:
  trend_up:
    price_above_ema200: 0.25
    ema20_above_ema50:  0.25
    adx_strong:         0.20
    rs_positive:        0.20
    volume_confirmed:   0.10

  trend_down:
    price_below_ema200: 0.25
    ema20_below_ema50:  0.25
    adx_strong:         0.20
    rs_negative:        0.20
    volume_confirmed:   0.10

  range:
    adx_weak:       0.20
    ema20_flat:     0.15
    ema50_flat:     0.15
    atr_low:        0.10
    range_bound:    0.20    # Phase 2
    bb_compressed:  0.10    # Phase 2
    ema_compressed: 0.10    # Phase 2

  momentum:
    rs_strong:        0.35
    adx_strong:       0.25
    volume_confirmed: 0.25
    atr_expanding:    0.15

  breakout_setup:
    atr_compressed:      0.35
    price_near_52w_high: 0.35
    volume_confirmed:    0.30

  # Phase 3: volatile requires instability signals, NOT just ATR expansion
  volatile:
    volatile_instability: 0.50    # composite-driven — PRIMARY
    atr_high:             0.30    # secondary
    high_reversal_freq:   0.20    # secondary

  quiet:
    atr_low:  0.65
    adx_weak: 0.35

  min_confidence: 0.50

dimensional_scores:
  trend:
    price_above_ema200: 0.40
    ema20_above_ema50:  0.20
    adx_strong:         0.25
    rs_positive:        0.15

  momentum:
    rs_strong:        0.35
    volume_confirmed: 0.25
    adx_strong:       0.25
    atr_expanding:    0.15

market_context:
  alignment_boost:      1.10
  misalignment_penalty: 0.90
  aligned_regimes:
    BULLISH_TREND:  ["TREND_UP", "MOMENTUM", "BREAKOUT_SETUP"]
    BEARISH_TREND:  ["TREND_DOWN", "VOLATILE"]
    SIDEWAYS:       ["RANGE", "QUIET"]
    VOLATILE:       ["VOLATILE", "BREAKOUT_SETUP"]
    QUIET:          ["QUIET", "RANGE"]
    UNCERTAIN:      []

ranking:
  top_n: 50
  opportunity_scoring:
    trend_weight:      0.30
    momentum_weight:   0.25
    stability_weight:  0.25
    low_vol_weight:    0.20
    min_regime_age_for_full_score: 5
    regime_penalties:
      UNCERTAIN: 0.0
      VOLATILE:  0.5
      QUIET:     0.6

# ── Universe Filters ─────────────────────────────────────────
filters:
  history:
    min_bars:             300
    max_gap_days:         5
    max_stale_days:       3
    gap_lookback_days:    90

  price:
    circuit_lookback_days: 90
    max_circuit_days:       3
    circuit_is_fatal:      false
    NSE:
      min_price_inr: 50.0
      max_price_inr: null
    NYSE:
      min_price_usd: 2.0
      max_price_usd: null
    NASDAQ:
      min_price_usd: 2.0
      max_price_usd: null

  liquidity:
    NSE:
      min_adv_cr:            50.0
      adv_period:            20
      max_zero_volume_ratio: 0.05
      max_volume_cv:         5.0
    NYSE:
      min_adv_usd_mn:        5.0
      adv_period:            20
      max_zero_volume_ratio: 0.05
      max_volume_cv:         5.0
    NASDAQ:
      min_adv_usd_mn:        5.0
      adv_period:            20
      max_zero_volume_ratio: 0.05
      max_volume_cv:         5.0

  high_rejection_warning_pct: 30.0

# ── Data Quality ─────────────────────────────────────────────
quality:
  fatal_spike_pct:  0.60
  warn_spike_pct:   0.20
  zero_volume_fill: true

# ── Regime Stability ─────────────────────────────────────────
stability:
  confirmation_bars:       3
  uncertain_propagates:    false
  smoothing_enabled:       true
  smoothing_alpha:         0.30
  hysteresis_threshold:    0.05
  persistence_window:      5
  regime_switch_threshold: 0.55

# ── Opportunity Quality Engine ────────────────────────────────
quality_engine:
  weights:
    liquidity:   0.25
    trend_clean: 0.25
    vol_health:  0.20
    stability:   0.20
    tradability: 0.10
  min_quality_score: 0.50

# ── Score Distribution Logging ────────────────────────────────
score_diagnostics:
  persist_distributions: true
  log_top_percentile:    90

# ── Breadth Engine ────────────────────────────────────────────
breadth_engine:
  extreme_threshold:     72.0
  expanding_threshold:   45.0    # lowered from 55 — earlier detection
  contracting_threshold: 38.0    # lowered from 45 — earlier detection
  emerging_weight:       0.40    # weight for unconfirmed (raw) signals

# ── Sector Engine ─────────────────────────────────────────────
sector_engine:
  leading_threshold: 60.0
  lagging_threshold: 40.0

# ── Strategy Router ───────────────────────────────────────────
strategy_router:
  min_quality_for_trade:     0.40
  min_confidence_for_trade:  0.50
  min_quality_for_full_size: 0.65
  adverse_breadth_states:
    - EXTREME_DOWN
    - CONTRACTING