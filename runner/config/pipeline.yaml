# ============================================================
#  Algo Trading Platform — Pipeline Configuration
# ============================================================

# ── Data fetching ────────────────────────────────────────────
data:
  start_date: "2018-01-01"
  end_date:   "today"
  cache_dir:  ".cache/ohlcv"
  cache_max_age_days: 1
  retry_attempts: 3

# ── Universes ────────────────────────────────────────────────
# symbol_source: path to a text file with one Yahoo Finance ticker per line.
# Generate with:
#   python scripts/build_nifty500.py
#   python scripts/build_sp500.py
universes:
  NIFTY500:
    benchmark:     "^NSEI"
    symbol_source: "data/universes/nifty500.txt"
    exchange:      "NSE"

  SP500:
    benchmark:     "^GSPC"
    symbol_source: "data/universes/sp500.txt"
    exchange:      "NYSE"

# ── Symbol loading options ────────────────────────────────────
symbol_loading:
  max_symbols:         null   # null = all; set an int (e.g. 20) for quick tests
  skip_on_fetch_error: true
  allow_missing_file:  false  # true = warn and skip; false = raise

# ── Output ───────────────────────────────────────────────────
output:
  root_dir:  "output"
  persist:   true
  log_dir:   "output/logs"
  log_level: "INFO"

# ── Engine config overrides ───────────────────────────────────
market_regime_config: null
stock_regime_config:  null
